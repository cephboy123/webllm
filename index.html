<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cephboy AI (BSN-Flash)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    h1 { font-size: 1.2rem; text-align: center; margin-bottom: 10px; color: #38bdf8; }
    #status { background: #1e293b; padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center; margin-bottom: 15px; border: 1px solid #334155; }
    #chat-box { flex: 1; overflow-y: auto; background: #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
    .user { background: #2563eb; align-self: flex-end; margin-left: auto; }
    .bot { background: #334155; align-self: flex-start; }
    #input-form { display: flex; gap: 8px; }
    input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; outline: none; }
    button { background: #2563eb; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
  <script type="module">
    import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.1.3/esm/index.js';

    const statusEl = document.getElementById('status');
    const chatBox = document.getElementById('chat-box');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let wllama = null;

    async function init() {
      try {
        statusEl.innerText = "Chargement du moteur Wllama...";
        
        const CONFIG_PATHS = {
          'single-thread/wllama.wasm': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.1.3/esm/single-thread/wllama.wasm',
          'multi-thread/wllama.wasm': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.1.3/esm/multi-thread/wllama.wasm',
        };

        wllama = new Wllama(CONFIG_PATHS);

        statusEl.innerText = "Téléchargement du modèle BSN-Flash (Hugging Face)...";
        await wllama.loadModelFromUrl('https://huggingface.co/Cephboy123/bsn_flash_q4_k_m.gguf/resolve/main/bsn_flash_q4_k_m.gguf', {
          n_threads: 1,
          progressCallback: ({ loaded, total }) => {
            const pct = Math.round((loaded / total) * 100);
            statusEl.innerText = `Téléchargement du modèle : ${pct}%`;
          }
        });

        statusEl.innerText = "Modèle prêt ! Pose ta question.";
        statusEl.style.borderColor = "#22c55e";
        inputEl.disabled = false;
        sendBtn.disabled = false;
      } catch (err) {
        statusEl.innerText = "Erreur : " + err.message;
        statusEl.style.borderColor = "#ef4444";
      }
    }

    window.sendMessage = async function(e) {
      if (e) e.preventDefault();
      const text = inputEl.value.trim();
      if (!text || !wllama) return;

      appendMsg(text, 'user');
      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      const botMsgEl = appendMsg("Réflexion en cours...", 'bot');

      try {
        let fullResponse = "";
        await wllama.createCompletion(text, {
          nPredict: 512,
          sampling: { temp: 0.7 },
          onNewToken: (token, piece, currentText) => {
            fullResponse = currentText;
            botMsgEl.innerText = fullResponse;
            chatBox.scrollTop = chatBox.scrollHeight;
          }
        });
      } catch (err) {
        botMsgEl.innerText = "Erreur : " + err.message;
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function appendMsg(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    document.getElementById('input-form').addEventListener('submit', window.sendMessage);
    init();
  </script>
</head>
<body>
  <h1>Cephboy AI (BSN-Flash)</h1>
  <div id="status">Initialisation...</div>
  <div id="chat-box"></div>
  <form id="input-form">
    <input type="text" id="user-input" placeholder="Pose ta question..." disabled autocomplete="off">
    <button type="submit" id="send-btn" disabled>Envoyer</button>
  </form>
</body>
</html>
