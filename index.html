<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cephboy AI</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    h1 { font-size: 1.2rem; text-align: center; margin-bottom: 10px; color: #38bdf8; }
    #status { background: #1e293b; padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center; margin-bottom: 15px; border: 1px solid #334155; }
    #chat-box { flex: 1; overflow-y: auto; background: #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
    .user { background: #2563eb; align-self: flex-end; margin-left: auto; }
    .bot { background: #334155; align-self: flex-start; }
    #input-form { display: flex; gap: 8px; }
    input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; outline: none; }
    button { background: #2563eb; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Cephboy AI</h1>
  <div id="status">Prêt ! Pose ta question.</div>
  <div id="chat-box"></div>
  <form id="input-form">
    <input type="text" id="user-input" placeholder="Pose ta question..." autocomplete="off">
    <button type="submit" id="send-btn">Envoyer</button>
  </form>

  <script>
    const chatBox = document.getElementById('chat-box');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');

    let history = [
      { role: "system", content: "Tu es Cephboy AI, un assistant virtuel intelligent, poli et précis." }
    ];

    async function sendMessage(e) {
      if (e) e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      history.push({ role: "user", content: text });

      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      statusEl.innerText = "Génération de la réponse...";

      const botMsgEl = appendMsg("...", 'bot');

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });

        const data = await response.json();

        if (data.choices && data.choices[0]) {
          const reply = data.choices[0].message.content;
          botMsgEl.innerText = reply;
          history.push({ role: "assistant", content: reply });
          statusEl.innerText = "Prêt ! Pose ta question.";
        } else {
          botMsgEl.innerText = "Erreur : " + (data.error || JSON.stringify(data));
        }
      } catch (err) {
        botMsgEl.innerText = "Erreur de connexion : " + err.message;
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function appendMsg(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    document.getElementById('input-form').addEventListener('submit', sendMessage);
  </script>
</body>
</html>
